name: CI

# PR과 main push 둘 다에서 돈다. 이게 초록이어야 머지한다.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postfeel
          POSTGRES_PASSWORD: postfeel
          POSTGRES_DB: postfeel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postfeel -d postfeel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postfeel:postfeel@localhost:5432/postfeel
      # CI 전용 더미값. 실제 시크릿이 아니다 — 여기서 도는 코드는 외부로 아무것도 보내지 않는다.
      ANSWER_KEY: ci-answer-key-not-a-real-secret
      FP_KEY: ci-fp-key-not-a-real-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # 빈 DB에서 마이그레이션이 도는지가 첫 관문이다.
      - run: npm run db:migrate

      # 재실행이 idempotent한지 같은 자리에서 확인한다.
      - run: npm run db:migrate

      - run: npm run typecheck

      - run: npm run lint

      # 테스트는 위 DB를 쓰지 않고 postfeel_test_* 를 새로 만들어 쓴다 (tests/setup/).
      - run: npm test

      - run: npm run build
